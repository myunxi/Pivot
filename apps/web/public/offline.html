<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Vicoa — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        background: #1a1a1a;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { margin: 0 0 0.75rem; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0 0 1.5rem; color: #b3b3b3; font-size: 0.9rem; line-height: 1.5; }
      a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border: 1px solid #3a3a3a;
        border-radius: 0.6rem;
        color: #f5f5f5;
        text-decoration: none;
        font-size: 0.875rem;
      }
      a:hover { background: #262626; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach your computer</h1>
      <p>
        Vicoa direct mode needs the computer's daemon and Tailscale. Reconnect
        Tailscale, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
